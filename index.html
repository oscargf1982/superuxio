 else if(e.vy<0){const r=Math.floor(e.y/T);for(let c=c0;c<=c1;c++)if(S(c,r)){e.y=(r+1)*T;e.vy=0;if(e===P&&G.gr[r][c]==2){G.gr[r][c]=3;if(hearts<3){hearts++;beep(880,.2)}else{score+=100;beep(988,.1)}}break}}}
const K={};
addEventListener('keydown',e=>{const k=e.code;if(['Space','ArrowLeft','ArrowRight'].includes(k))e.preventDefault();K[k]=1;
 if(k=='Space'||k=='Enter'){if(st=='title'||st=='over'||st=='win'){if(msg>20||st=='title')start()}else if(st=='clear'){if(msg>30)load(lv+1)}else if(st=='play'&&k=='Space'&&!e.repeat)P.jb=8}});
addEventListener('keyup',e=>K[e.code]=0);
function start(){lv=0;hearts=3;score=0;load(0)}
function load(n){lv=n;msg=0;if(n>=8){st='win';return}G=n%4==3?buildB(n):n==0?buildL1():n==1?buildL2():n==2?buildL3():build(n);P={x:60,y:9*T-56,w:40,h:56,vx:0,vy:0,on:0,face:1,an:0,inv:0,jb:0,coy:0,sx:60,sy:9*T-56};cam=0;st='play'}
function hurt(pit,from){
 hearts--;beep(160,.3,'sawtooth');
 if(hearts<=0){st='over';msg=0;return}
 P.inv=120;if(pit){P.x=P.sx;P.y=P.sy;P.vx=P.vy=0}else{P.vy=-8;P.vx=from*6}}
function update(){
 tt++;msg++;if(st!='play')return;
 const ax=(K.KeyD||K.ArrowRight?1:0)-(K.KeyA||K.ArrowLeft?1:0);
 if(ax){P.vx+=ax*.5;P.face=ax}else P.vx*=.88;if(Math.abs(P.vx)<.05)P.vx=0;
 P.vx=clamp(P.vx,-5.5,5.5);P.vy=Math.min(P.vy+.6,16);
 P.coy=P.on?6:P.coy-1;P.jb--;
 if(P.jb>0&&P.coy>0){P.vy=-14.6;P.coy=0;P.jb=0;beep(440,.15)}
 if(!K.Space&&P.vy<-4)P.vy=-4;
 step(P);P.an+=Math.abs(P.vx)*.05;if(P.inv>0)P.inv--;
 if(P.on){const c=Math.floor((P.x+P.w/2)/T),r=Math.floor((P.y+P.h+2)/T);if(S(c-1,r)&&S(c,r)&&S(c+1,r)){P.sx=P.x;P.sy=P.y}}
 if(P.y>VH+80){hurt(true);return}
 cam=clamp(P.x-VW*.4,0,G.L*T-VW);
 for(const h of G.hp)if(!h.got&&Math.abs(P.x+20-h.x-14)<30&&Math.abs(P.y+28-h.y-14)<40){h.got=1;if(hearts<3)hearts++;else score+=50;beep(880,.2)}
 for(const R of G.rom){
  if(R.dead){R.dead++;continue}if(R.hit>0)R.hit--;
  R.vy=Math.min(R.vy+.6,16);if(R.boss&&tt%90==0)R.dir=P.x<R.x?-1:1;R.vx=R.dir*R.sp;step(R);if(R.hx)R.dir*=-1;
  if(R.on){const c=Math.floor((R.x+(R.dir>0?R.w+4:-4))/T),r=Math.floor((R.y+R.h+2)/T);if(!S(c,r))R.dir*=-1}
  R.an+=.18;
  if(R.hit<=0&&P.x+P.w-6>R.x&&P.x+6<R.x+R.w&&P.y+P.h>R.y+4&&P.y<R.y+R.h){
   if(P.vy>0&&P.y+P.h-R.y<28+P.vy){if(R.boss&&R.sh>0){R.sh--;R.hit=45;P.vy=-11;score+=150;R.sp+=.5;beep(200,.25,'sawtooth')}else if(R.sh>1){R.sh=1;R.hit=30;P.vy=-9;score+=50;R.sp+=.6;beep(300,.15,'sawtooth')}else{R.dead=1;P.vy=-9;score+=100;beep(700,.1)}}
   else if(P.inv<=0){hurt(false,P.x<R.x?-1:1);if(st!='play')return}}}
 if(G.boss&&G.boss.dead>=25){st='clear';msg=0;score+=500;beep(660,.4,'triangle');return}
 G.rom=G.rom.filter(R=>R.dead<30&&R.y<VH+100);
 if(P.x>G.flag){st='clear';msg=0;score+=200;beep(660,.4,'triangle')}}
function spr(i,cx,b,sc,flip,rot){const w=i.width*sc,h=i.height*sc;x.save();x.translate(cx,b);if(rot)x.rotate(rot);if(flip)x.scale(-1,1);x.drawImage(i,-w/2,-h,w,h);x.restore()}
function heart(cx,cy,s,f){x.save();x.translate(cx,cy);x.scale(s,s);x.beginPath();x.moveTo(0,.9);x.bezierCurveTo(-1.6,-.2,-.9,-1.2,0,-.4);x.bezierCurveTo(.9,-1.2,1.6,-.2,0,.9);x.fillStyle=f?'#e8293b':'rgba(0,0,0,.4)';x.fill();x.strokeStyle='#fff';x.lineWidth=.1;x.stroke();x.restore()}
function txt(s,y,sz,col){x.font='bold '+sz+'px Impact,Arial Black,sans-serif';x.textAlign='center';x.lineWidth=sz/6;x.strokeStyle='#000';x.strokeText(s,VW/2,y);x.fillStyle=col||'#ffd43b';x.fillText(s,VW/2,y)}
function bg(th){if(G&&G.cave&&st!='title'&&st!='win'){x.fillStyle='#050510';x.fillRect(0,0,VW,VH);return}
 const g=x.createLinearGradient(0,0,0,VH);g.addColorStop(0,th.s[0]);g.addColorStop(1,th.s[1]);x.fillStyle=g;x.fillRect(0,0,VW,VH);
 if(th.st){x.fillStyle='#fff';for(let i=0;i<50;i++)x.fillRect((i*197)%VW,(i*83)%260,2,2);x.fillStyle='#f4f1c9';x.beginPath();x.arc(780,90,36,0,7);x.fill()}
 else{x.fillStyle='#fff6a8';x.beginPath();x.arc(780,90,40,0,7);x.fill()}
 x.fillStyle=th.st?'#ffffff22':'#ffffffcc';for(let i=0;i<6;i++){const cx=((i*330-cam*.2+tt*.1)%1800+1800)%1800-200,cy=60+(i*53)%120;x.beginPath();x.ellipse(cx,cy,60,18,0,0,7);x.ellipse(cx+30,cy-12,40,18,0,0,7);x.fill()}
 x.fillStyle=th.h;x.beginPath();x.moveTo(0,VH);for(let p=0;p<=VW;p+=16){const w=p+cam*.4;x.lineTo(p,380-Math.sin(w*.006)*50-Math.sin(w*.015)*18)}x.lineTo(VW,VH);x.fill()}
function draw(){
 const th=TH[G&&G.th!=null?G.th:(lv%4==3?1:lv%4+(lv>>2))%3];
 if(st=='title'||st=='win'){bg(th);cam=tt*2}else bg(th);
 if(G&&st!='title'&&st!='win'){
  x.save();x.translate(-Math.round(cam),0);
  const c0=Math.floor(cam/T),c1=c0+Math.ceil(VW/T)+1;
  for(let r=0;r<ROWS;r++)for(let c=c0;c<=Math.min(c1,G.L-1);c++)if(G.gr[r][c]){
   const px=c*T,py=r*T,top=!G.gr[r-1]||!G.gr[r-1][c];
   if(G.gr[r][c]>4){if(G.gr[r][c]==5){x.fillStyle='#3da34a';x.fillRect(px,py,T,T);x.fillStyle='#6fd37a';x.fillRect(px,py,T,10);x.fillStyle='#2a7a35';x.fillRect(px,py+T-8,T,8);x.fillStyle='#e8ffe8';x.fillRect(px+10,py+18,6,6);x.fillRect(px+30,py+26,6,6)}else{x.fillStyle='#c26a2e';x.fillRect(px+6,py,T-12,T);x.fillStyle='#8a4a1c';x.fillRect(px+14,py,4,T);x.fillRect(px+30,py,4,T)}}else if(r>=9){x.fillStyle=G.cave?'#1b6f78':th.d;x.fillRect(px,py,T,T);x.fillStyle='#0003';x.fillRect(px+8,py+r%3*10+10,10,6);x.fillRect(px+28,py+26,8,6);if(top){x.fillStyle=G.cave?'#3fb5b5':th.g;x.fillRect(px,py,T,12);x.fillStyle='#0002';x.fillRect(px,py+12,T,3)}}
   else if(G.gr[r][c]==4){x.fillStyle='#2fa84f';x.fillRect(px,py,T,T);x.fillStyle='#7ee08f';x.fillRect(px+6,py,8,T);x.strokeStyle='#14521f';x.lineWidth=3;x.strokeRect(px+1,py+1,T-2,T-2);if(!G.gr[r-1]||G.gr[r-1][c]!=4){x.fillStyle='#37c25c';x.fillRect(px-3,py,T+6,16);x.strokeRect(px-3,py+1,T+6,15)}}else if(G.gr[r][c]>1){x.fillStyle=G.gr[r][c]==2?'#f2a900':'#8a6a3a';x.fillRect(px,py,T,T);x.strokeStyle='#5a3a00';x.lineWidth=2;x.strokeRect(px+1,py+1,T-2,T-2);if(G.gr[r][c]==2){x.fillStyle='#fff';x.font='bold 30px Arial';x.textAlign='center';x.fillText('?',px+T/2,py+34)}}else{x.fillStyle=G.cave?'#2a9aa3':'#b9a27a';x.fillRect(px,py,T,T);x.strokeStyle='#6b5a3c';x.lineWidth=2;x.strokeRect(px+1,py+1,T-2,T-2);x.fillStyle='#fff4';x.fillRect(px+3,py+3,T-6,5)}}
  for(const h of G.hp)if(!h.got)heart(h.x+14,h.y+14+Math.sin(tt*.1)*3,14,1);
  const fx=G.flag;x.fillStyle='#ddd';x.fillRect(fx,9*T-190,6,190);x.fillStyle='#e8293b';x.beginPath();x.moveTo(fx+6,9*T-190);x.lineTo(fx+70,9*T-165+Math.sin(tt*.15)*4);x.lineTo(fx+6,9*T-140);x.fill();if(G.cx){const cx=G.cx,cy=9*T;x.fillStyle='#a8571d';x.fillRect(cx,cy-110,130,110);for(let i=0;i<4;i++)x.fillRect(cx+i*36,cy-132,26,24);x.fillStyle='#000';x.beginPath();x.moveTo(cx+50,cy);x.lineTo(cx+50,cy-40);x.arc(cx+65,cy-40,15,Math.PI,0);x.lineTo(cx+80,cy);x.fill()}
  for(const R of G.rom){const f=RM[Math.floor(R.an)%RM.length];x.save();if(R.dead){x.globalAlpha=1-R.dead/30;x.translate(0,R.dead*1.2);}if(R.hit>0&&tt%4<2)x.globalAlpha=.5;const k=R.boss?2:1;spr(f,R.x+R.w/2,R.y+R.h+3,R.boss?1.2:.72,R.dir<0);if(R.boss?R.sh>0:R.sh>1){const sx=R.x+R.w/2+R.dir*20*k;x.fillStyle=R.boss?'#8e1b1b':'#2a3fb5';x.fillRect(sx-9*k,R.y+10*k,18*k,42*k);x.strokeStyle='#ffd43b';x.lineWidth=3*k;x.strokeRect(sx-9*k,R.y+10*k,18*k,42*k);x.fillStyle='#fff';x.fillRect(sx-2*k,R.y+16*k,4*k,30*k)}x.restore()}
  if(st!='over'&&!(P.inv>0&&tt%8<4)){
   const f=BK[Math.floor(P.an)%4];spr(f,P.x+P.w/2,P.y+P.h+4,.4,P.face<0,P.on?0:clamp(P.vy*.02,-.3,.3)*P.face)}
  x.restore();
  x.fillStyle='#0005';x.fillRect(10,10,230,48);for(let i=0;i<3;i++)heart(36+i*44,34,18,i<hearts);
  x.textAlign='right';txt('★ '+score,44,28,'#fff');x.textAlign='center';
  x.font='bold 18px Arial';x.fillStyle='#fff';x.textAlign='left';x.fillText(lv%4==3?'¡JEFE ROMANO!':'Fase '+(lv+1)+' · '+NAMES[lv%4],VW-260,30);
  const B=G.boss,pr=B?(B.dead?0:(B.sh+1)/4):clamp(P.x/G.flag,0,1);x.fillStyle='#0006';x.fillRect(VW-260,40,240,8);x.fillStyle=B?'#e8293b':'#ffd43b';x.fillRect(VW-260,40,240*pr,8);if(B&&msg<100)txt('¡Jefe romano! Rómpele el escudo',150,40,'#ff6b6b')}
 if(st=='title'){x.fillStyle='#0006';x.fillRect(0,0,VW,VH);txt('SuperUxio',170,96);spr(BK[Math.floor(tt/6)%4],VW/2-170,380,1.1);spr(RM[Math.floor(tt/6)%9],VW/2+170,380,1.7,1);if(tt%60<40)txt('Pulsa ESPACIO para empezar',470,32,'#fff')}
 if(st=='clear'){x.fillStyle='#0007';x.fillRect(0,0,VW,VH);txt('¡Nivel completado!',230,64);txt('Puntos: '+score,290,32,'#fff');if(msg>30)txt('ESPACIO para continuar',380,28,'#fff')}
 if(st=='over'){x.fillStyle='#000a';x.fillRect(0,0,VW,VH);spr(FL,VW/2,300,1.4);txt('¡Game Over!',130,72,'#ff6b6b');txt('Puntos: '+score,400,30,'#fff');if(msg>20)txt('ESPACIO para reintentar',460,26,'#fff')}
 if(st=='win'){x.fillStyle='#0007';x.fillRect(0,0,VW,VH);txt('¡SuperUxio lo ha logrado!',200,60);txt('Puntos finales: '+score,270,34,'#fff');spr(BK[Math.floor(tt/6)%4],VW/2,420,1.3);if(msg>20)txt('ESPACIO para jugar otra vez',490,24,'#fff')}}
let last=0,acc=0;
function loop(t){acc+=Math.min(50,t-last);last=t;while(acc>=1000/60){update();acc-=1000/60}draw();requestAnimationFrame(loop)}
requestAnimationFrame(t=>{last=t;loop(t)});
</script></body></html>
